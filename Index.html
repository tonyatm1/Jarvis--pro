<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKOS - Personal AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 500px;
            margin: 0 auto;
            width: 100%;
            background: #0a0e27;
            box-shadow: 0 0 40px rgba(0, 200, 255, 0.1);
        }

        /* HEADER */
        .header {
            background: linear-gradient(135deg, #1a2f5f 0%, #2a1f5f 100%);
            padding: 16px;
            border-bottom: 2px solid rgba(0, 200, 255, 0.3);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .header-title {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #00c8ff, #0088ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .status-bar {
            display: flex;
            justify-content: space-around;
            font-size: 11px;
            color: #888;
            gap: 16px;
            flex-wrap: wrap;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
            animation: pulse 2s infinite;
        }

        .status-dot.inactive {
            background: #ff4444;
            box-shadow: 0 0 10px rgba(255, 68, 68, 0.6);
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* CHAT AREA */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(0, 200, 255, 0.3);
            border-radius: 3px;
        }

        .message {
            display: flex;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            line-height: 1.4;
            font-size: 14px;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #0088ff, #00c8ff);
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 136, 255, 0.3);
        }

        .message.ai .message-bubble {
            background: linear-gradient(135deg, #1a3a5f, #2a1f5f);
            color: #e0e0e0;
            border: 1px solid rgba(0, 200, 255, 0.3);
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 200, 255, 0.2);
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #666;
            gap: 16px;
        }

        .empty-state-icon {
            font-size: 48px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 14px;
            color: #888;
        }

        /* INPUT AREA */
        .input-container {
            padding: 16px;
            border-top: 2px solid rgba(0, 200, 255, 0.3);
            background: linear-gradient(180deg, transparent, rgba(26, 47, 95, 0.3));
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        input[type="text"] {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 200, 255, 0.3);
            color: #e0e0e0;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(0, 200, 255, 0.6);
            box-shadow: 0 0 15px rgba(0, 200, 255, 0.2);
        }

        input[type="text"]::placeholder {
            color: #666;
        }

        /* BUTTONS */
        button {
            padding: 12px 16px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 44px;
            min-height: 44px;
        }

        .send-btn {
            background: linear-gradient(135deg, #0088ff, #00c8ff);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 136, 255, 0.4);
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 136, 255, 0.6);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .mic-btn {
            background: rgba(0, 200, 255, 0.1);
            color: #00c8ff;
            border: 2px solid rgba(0, 200, 255, 0.3);
        }

        .mic-btn:hover {
            background: rgba(0, 200, 255, 0.2);
            border-color: rgba(0, 200, 255, 0.6);
        }

        .mic-btn.listening {
            background: rgba(255, 68, 68, 0.2);
            border-color: rgba(255, 68, 68, 0.6);
            color: #ff4444;
            animation: micPulse 0.5s infinite;
        }

        @keyframes micPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(255, 68, 68, 0); }
        }

        .clear-btn {
            background: rgba(255, 68, 68, 0.1);
            color: #ff8888;
            border: 2px solid rgba(255, 68, 68, 0.3);
            font-size: 12px;
            padding: 8px 12px;
        }

        .clear-btn:hover {
            background: rgba(255, 68, 68, 0.2);
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0, 200, 255, 0.3);
            border-top-color: #00c8ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            .header-title {
                font-size: 20px;
            }

            .message-bubble {
                max-width: 90%;
                font-size: 13px;
            }
        }

        .error-message {
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid rgba(255, 68, 68, 0.5);
            color: #ff8888;
            padding: 12px;
            border-radius: 12px;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <div class="header-title">⚡ AKOS</div>
            <div class="status-bar">
                <div class="status-item">
                    <div class="status-dot"></div>
                    <span>Online</span>
                </div>
                <div class="status-item">
                    <div class="status-dot" id="memoryStatus"></div>
                    <span>Memory</span>
                </div>
                <div class="status-item">
                    <div class="status-dot" id="voiceStatus" class="inactive"></div>
                    <span>Voice</span>
                </div>
            </div>
        </div>

        <!-- CHAT AREA -->
        <div class="chat-container" id="chatContainer">
            <div class="empty-state">
                <div class="empty-state-icon">🤖</div>
                <div class="empty-state-text">Hello! I'm AKOS, your personal AI assistant.<br>Start typing or use the microphone to chat.</div>
            </div>
        </div>

        <!-- INPUT AREA -->
        <div class="input-container">
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Message AKOS..." 
                    autocomplete="off"
                >
                <button class="mic-btn" id="micBtn" title="Voice Input">🎤</button>
            </div>
            <button class="send-btn" id="sendBtn" title="Send Message">Send</button>
            <button class="clear-btn" id="clearBtn" title="Clear Conversation">Clear</button>
        </div>
    </div>

    <script>
        // ============================================
        // AKOS v0.1 - Main Application Logic
        // ============================================

        class AKOS {
            constructor() {
                this.messages = [];
                this.isLoading = false;
                this.recognition = null;
                this.isListening = false;
                this.synthesis = null;
                
                this.init();
            }

            init() {
                this.setupElements();
                this.setupEventListeners();
                this.setupSpeechRecognition();
                this.setupSpeechSynthesis();
                this.loadMessagesFromStorage();
                this.updateMemoryStatus();
                this.renderChat();
            }

            setupElements() {
                this.chatContainer = document.getElementById('chatContainer');
                this.messageInput = document.getElementById('messageInput');
                this.sendBtn = document.getElementById('sendBtn');
                this.micBtn = document.getElementById('micBtn');
                this.clearBtn = document.getElementById('clearBtn');
                this.memoryStatus = document.getElementById('memoryStatus');
                this.voiceStatus = document.getElementById('voiceStatus');
            }

            setupEventListeners() {
                this.sendBtn.addEventListener('click', () => this.sendMessage());
                this.messageInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && !this.isLoading) {
                        this.sendMessage();
                    }
                });
                this.micBtn.addEventListener('click', () => this.toggleVoiceInput());
                this.clearBtn.addEventListener('click', () => this.clearConversation());
            }

            setupSpeechRecognition() {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    this.micBtn.disabled = true;
                    this.micBtn.title = 'Voice input not supported in this browser';
                    return;
                }

                this.recognition = new SpeechRecognition();
                this.recognition.continuous = false;
                this.recognition.interimResults = true;
                this.recognition.lang = 'en-US';

                this.recognition.onstart = () => {
                    this.isListening = true;
                    this.micBtn.classList.add('listening');
                    this.voiceStatus.classList.remove('inactive');
                };

                this.recognition.onresult = (event) => {
                    let interim = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i].transcript;
                        if (event.results[i].isFinal) {
                            this.messageInput.value = transcript;
                        } else {
                            interim += transcript;
                        }
                    }
                };

                this.recognition.onend = () => {
                    this.isListening = false;
                    this.micBtn.classList.remove('listening');
                    this.voiceStatus.classList.add('inactive');
                };

                this.recognition.onerror = (event) => {
                    console.error('Speech recognition error:', event.error);
                    this.isListening = false;
                    this.micBtn.classList.remove('listening');
                    this.voiceStatus.classList.add('inactive');
                };
            }

            setupSpeechSynthesis() {
                this.synthesis = window.speechSynthesis;
                if (!this.synthesis) {
                    console.warn('Speech synthesis not supported');
                    return;
                }
            }

            toggleVoiceInput() {
                if (!this.recognition) return;
                
                if (this.isListening) {
                    this.recognition.stop();
                } else {
                    this.messageInput.value = '';
                    this.recognition.start();
                }
            }

            async sendMessage() {
                const message = this.messageInput.value.trim();
                if (!message || this.isLoading) return;

                // Add user message
                this.messages.push({ role: 'user', content: message });
                this.messageInput.value = '';
                this.isLoading = true;
                this.sendBtn.disabled = true;
                this.renderChat();
                this.saveMessagesToStorage();

                try {
                    // Call the serverless function
                    const response = await fetch('/.netlify/functions/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ message: message })
                    });

                    if (!response.ok) {
                        throw new Error(`API error: ${response.status}`);
                    }

                    const data = await response.json();
                    
                    if (data.error) {
                        throw new Error(data.error);
                    }

                    // Add AI response
                    this.messages.push({ role: 'ai', content: data.response });
                    this.saveMessagesToStorage();
                    this.renderChat();

                    // Speak the response if synthesis available
                    if (this.synthesis && data.response) {
                        this.speakResponse(data.response);
                    }

                } catch (error) {
                    console.error('Error:', error);
                    this.messages.push({ 
                        role: 'ai', 
                        content: `⚠️ Error: ${error.message || 'Failed to get response. Make sure your API key is configured in Netlify.'}`
                    });
                    this.renderChat();
                    this.saveMessagesToStorage();
                } finally {
                    this.isLoading = false;
                    this.sendBtn.disabled = false;
                }
            }

            speakResponse(text) {
                if (!this.synthesis) return;

                // Cancel any ongoing speech
                this.synthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1;
                utterance.pitch = 1;
                utterance.volume = 0.8;

                this.synthesis.speak(utterance);
            }

            renderChat() {
                if (this.messages.length === 0) {
                    this.chatContainer.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">🤖</div>
                            <div class="empty-state-text">Hello! I'm AKOS, your personal AI assistant.<br>Start typing or use the microphone to chat.</div>
                        </div>
                    `;
                    return;
                }

                this.chatContainer.innerHTML = this.messages.map(msg => `
                    <div class="message ${msg.role}">
                        <div class="message-bubble">
                            ${msg.content}
                        </div>
                    </div>
                `).join('');

                // Scroll to bottom
                this.chatContainer.scrollTop = this.chatContainer.scrollHeight;
            }

            saveMessagesToStorage() {
                localStorage.setItem('akos_messages', JSON.stringify(this.messages));
                this.updateMemoryStatus();
            }

            loadMessagesFromStorage() {
                try {
                    const stored = localStorage.getItem('akos_messages');
                    if (stored) {
                        this.messages = JSON.parse(stored);
                    }
                } catch (error) {
                    console.error('Error loading messages:', error);
                    this.messages = [];
                }
            }

            updateMemoryStatus() {
                const hasMemory = this.messages.length > 0;
                const status = document.getElementById('memoryStatus');
                if (hasMemory) {
                    status.classList.remove('inactive');
                } else {
                    status.classList.add('inactive');
                }
            }

            clearConversation() {
                if (confirm('Clear all messages? This cannot be undone.')) {
                    this.messages = [];
                    localStorage.removeItem('akos_messages');
                    this.renderChat();
                    this.updateMemoryStatus();
                }
            }
        }

        // Initialize AKOS when page loads
        window.addEventListener('DOMContentLoaded', () => {
            new AKOS();
        });
    </script>
</body>
  </html>
